name: Release Debian Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v0.1.0)'
        required: false
        default: ''
        type: string
      draft:
        description: 'Create as a draft release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release-deb:
    name: Build & Release DEB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm run test:unit

      - name: Build Debian (.deb) binary
        run: npm run build:deb

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: dist/*.deb
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: dist/*.deb
          generate_release_notes: true
          draft: ${{ inputs.draft || false }}
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
